name: Release Desktop

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # ─── macOS Apple Silicon (arm64) ─────────────────────────────────────────
  build-mac-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build server
        run: bun run build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Typecheck desktop
        working-directory: desktop
        run: bun run typecheck

      - name: Build macOS arm64 package
        working-directory: desktop
        run: bun run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-arm64
          path: desktop/release/*.dmg
          if-no-files-found: warn

  # ─── Windows ─────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build server
        run: bun run build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Typecheck desktop
        working-directory: desktop
        run: bun run typecheck

      - name: Build Windows package
        working-directory: desktop
        run: bun run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win
          path: |
            desktop/release/*.exe
            desktop/release/*.msi
          if-no-files-found: warn

  # ─── Linux (x64) ────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build server
        run: bun run build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Typecheck desktop
        working-directory: desktop
        run: bun run typecheck

      - name: Build Linux x64 package
        working-directory: desktop
        run: bun run package:linux -- --x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64
          path: desktop/release/*.AppImage
          if-no-files-found: error

  # ─── Upload all artifacts to the GitHub Release ──────────────────────────
  release-upload:
    name: Upload to Release
    needs: [ build-mac-arm64, build-win, build-linux-x64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        working-directory: artifacts
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS

      - name: Upload artifacts to GitHub Release
        run: |
          find artifacts -type f -exec \
            gh release upload "${{ github.ref_name }}" {} --clobber \;
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
